<style>
/* ══════════════════════════════════════════════════════════════════
   АТЛАС РОССИИ

   Три карты в одной странице: гидрография, орография и политическое
   деление. Геометрия лежит в data/*.js уже в координатах холста —
   проекцию (равновеликая коническая Альберса) посчитал сборщик на
   Python, браузеру остаётся только нарисовать пути.

   Что здесь важно понимать про производительность. На карте около
   тысячи SVG-элементов. Всё, что можно, вынесено из JavaScript в CSS:
   цвета, подсветка при наведении, толщина линий, размер шрифта
   подписей. При смене темы или масштаба скрипт трогает пару атрибутов
   на группах, а не тысячу элементов по одному.
   ══════════════════════════════════════════════════════════════════ */

/* ─── Токены ─────────────────────────────────────────────────────── */
:root {
  --face: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --bar-h: 60px;
}

/* Тёмная тема — основная: карта с подсветкой воды и рельефа читается
   на тёмном фоне так же, как снимок из космоса. */
html[data-theme="dark"] {
  --bg:        #080c14;
  --bg-deep:   #05080e;
  --glass:     rgba(15, 23, 38, 0.78);
  --glass-2:   rgba(24, 34, 54, 0.86);
  --solid:     #131c2e;
  --line:      rgba(148, 170, 205, 0.16);
  --line-2:    rgba(148, 170, 205, 0.28);
  --text:      #e7eefb;
  --text-dim:  #94a5c0;
  --text-mute: #6b7d99;
  --accent:    #4cc4ff;
  --accent-ink:#04202f;
  --warn:      #ffb454;
  --shadow:    0 18px 50px rgba(0, 0, 0, 0.55);

  --m-water:   #0c2033;
  --m-water-2: #123049;
  --m-land:    #141c28;
  --m-land-ru: #1c2736;
  --m-coast:   #33455f;
  --m-grat:    rgba(120, 150, 190, 0.14);
  --m-label:   #dce7f7;
  --m-label-2: #9fb4d0;
  --m-halo:    #05080e;

  --fd-1: #6b8fd4;  --fd-2: #46a08c;  --fd-3: #c77b57;  --fd-4: #b0709e;
  --fd-5: #8aa54f;  --fd-6: #c9a45c;  --fd-7: #5aa3c4;  --fd-8: #9077cf;

  --o-range:   #a86b45;
  --o-plateau: #b89a48;
  --o-upland:  #86a054;
  --o-plain:   #4a967d;
  --o-lowland: #5484b5;
  --o-pen:     #8d78b8;

  --h-river:   #4fb0e8;
  --h-river-2: #3a86b8;
  --h-lake:    #2f8fcf;
  --h-res:     #46b3bd;
}

html[data-theme="light"] {
  --bg:        #eef2f8;
  --bg-deep:   #e3e9f2;
  --glass:     rgba(255, 255, 255, 0.82);
  --glass-2:   rgba(255, 255, 255, 0.94);
  --solid:     #ffffff;
  --line:      rgba(24, 40, 70, 0.14);
  --line-2:    rgba(24, 40, 70, 0.24);
  --text:      #101a2b;
  --text-dim:  #4a5a73;
  --text-mute: #77869e;
  --accent:    #0a6fb8;
  --accent-ink:#ffffff;
  --warn:      #a8600b;
  --shadow:    0 16px 40px rgba(20, 40, 70, 0.16);

  --m-water:   #d3e6f5;
  --m-water-2: #bcd9ee;
  --m-land:    #e4e8ee;
  --m-land-ru: #f2f4f7;
  --m-coast:   #93a6bd;
  --m-grat:    rgba(60, 100, 150, 0.16);
  --m-label:   #17263c;
  --m-label-2: #45566f;
  --m-halo:    #ffffff;

  --fd-1: #a9c0ea;  --fd-2: #9ad5c6;  --fd-3: #eeb695;  --fd-4: #e0aed2;
  --fd-5: #c6d894;  --fd-6: #efd097;  --fd-7: #a5d3e8;  --fd-8: #c4b4ee;

  --o-range:   #d9a882;
  --o-plateau: #e5cd8a;
  --o-upland:  #bed092;
  --o-plain:   #9dd4c0;
  --o-lowland: #a8c8e6;
  --o-pen:     #c3b6e2;

  --h-river:   #2c86c4;
  --h-river-2: #4a9ed4;
  --h-lake:    #6bb6e2;
  --h-res:     #57bcc6;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--face);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button, input { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.vh {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ─── Каркас ─────────────────────────────────────────────────────── */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
}

/* ─── Верхняя панель ─────────────────────────────────────────────── */
.bar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  min-height: var(--bar-h);
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(1.5);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.brand svg { width: 22px; height: 22px; display: block; }
.brand b { font-weight: 650; }
.brand span {
  font: 500 11px/1 var(--mono);
  color: var(--text-mute);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding-left: var(--sp-2);
  border-left: 1px solid var(--line-2);
}

.spacer { flex: 1 1 auto; }

/* Сегментированный переключатель. Бегунок — отдельный слой под
   кнопками: анимируется transform, а не layout, поэтому не дёргается. */
.seg {
  position: relative;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.seg::before {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  height: calc(100% - 6px);
  width: var(--seg-w, 0px);
  transform: translateX(var(--seg-x, 0px));
  background: var(--accent);
  border-radius: calc(var(--r-md) - 4px);
  transition: transform 0.32s var(--ease), width 0.32s var(--ease);
  pointer-events: none;
}
.seg button {
  position: relative;
  z-index: 1;
  appearance: none;
  border: 0;
  background: none;
  cursor: pointer;
  padding: 8px 14px;
  min-height: 36px;
  border-radius: calc(var(--r-md) - 4px);
  color: var(--text-dim);
  font-weight: 550;
  white-space: nowrap;
  transition: color 0.2s var(--ease);
}
.seg button[aria-selected="true"] { color: var(--accent-ink); }
.seg button:hover { color: var(--text); }
.seg button[aria-selected="true"]:hover { color: var(--accent-ink); }

.seg.sub { --pad: 2px; }
.seg.sub button { padding: 6px 12px; font-size: 14px; }

/* Плавное появление подвкладок физической карты */
.subwrap {
  display: grid;
  grid-template-columns: 0fr;
  opacity: 0;
  transition: grid-template-columns 0.34s var(--ease), opacity 0.24s var(--ease);
}
.subwrap > * { overflow: hidden; min-width: 0; }
.subwrap.on { grid-template-columns: 1fr; opacity: 1; }

/* ─── Поиск ──────────────────────────────────────────────────────── */
.find { position: relative; width: min(280px, 42vw); }
.find > svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-mute);
  pointer-events: none;
}
.find input {
  width: 100%;
  height: 40px;
  padding: 0 34px 0 32px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.find input::placeholder { color: var(--text-mute); }
/* У input[type=search] Chromium рисует собственный крестик очистки —
   рядом с нашей кнопкой их получалось два. */
.find input::-webkit-search-cancel-button,
.find input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.find input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  outline: none;
}
.find .clear {
  position: absolute; right: 4px; top: 50%;
  transform: translateY(-50%);
  width: 32px; height: 32px;
  display: none; place-items: center;
  border: 0; background: none; border-radius: 50%;
  color: var(--text-mute); cursor: pointer;
}
.find .clear:hover { color: var(--text); background: var(--line); }
.find.filled .clear { display: grid; }

/* Список результатов делаем почти непрозрачным. Полупрозрачное стекло
   здесь не работает: панель уже стоит в слое с backdrop-filter, вложенное
   размытие берёт фон только своего слоя, и сквозь список просвечивала
   карточка субъекта. */
.hits {
  position: absolute;
  /* Шире поля ввода: «Петропавловск-Камчатский» с пояснением в 280 px
     не помещается и режется многоточием. */
  top: calc(100% + 6px); right: 0;
  width: max(100%, 340px);
  max-height: min(58vh, 420px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--solid);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 4px;
  display: none;
}
.hits.on { display: block; }
.hits li { list-style: none; }
.hits button {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 1px;
  text-align: left;
  padding: 8px 10px;
  border: 0;
  background: none;
  border-radius: var(--r-sm);
  cursor: pointer;
  min-height: 40px;
}
.hits button:hover,
.hits button[data-cur="1"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.hits .nm { font-weight: 500; }
.hits .sub { color: var(--text-mute); font-size: 12px; }
.hits .empty { padding: 14px 12px; color: var(--text-mute); }
.hits mark { background: none; color: var(--accent); font-weight: 650; }

/* ─── Кнопки-иконки ──────────────────────────────────────────────── */
.ico {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg-deep);
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.2s var(--ease), border-color 0.2s var(--ease),
              background 0.2s var(--ease), transform 0.12s var(--ease);
}
.ico:hover { color: var(--text); border-color: var(--line-2); }
.ico:active { transform: scale(0.94); }
.ico svg { width: 18px; height: 18px; display: block; }
.ico .sun { display: none; }
html[data-theme="light"] .ico .sun { display: block; }
html[data-theme="light"] .ico .moon { display: none; }

/* ─── Сцена карты ────────────────────────────────────────────────── */
/* Фон контейнера — это и есть вода: холст SVG прозрачен, море на карте
   просто не закрыто сушей. Поэтому никакого шва по краю карты нет —
   вода за её пределами продолжается тем же цветом. */
.stage-wrap {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 100% at 50% 8%,
      var(--m-water-2) 0%, var(--m-water) 62%,
      color-mix(in srgb, var(--m-water) 70%, var(--bg-deep)) 100%);
  touch-action: none;
  cursor: grab;
  contain: strict;
}
.stage-wrap.drag { cursor: grabbing; }

/* Холст ровно того размера, что задал сборщик. Panzoom крутит его
   целиком одним transform — браузер обрабатывает это на композиторе. */
.stage {
  position: absolute;
  left: 50%; top: 50%;
  margin-left: calc(var(--mw) / -2);
  margin-top: calc(var(--mh) / -2);
  width: var(--mw);
  height: var(--mh);
  transform-origin: center center;
  will-change: transform;
}
.stage svg { display: block; overflow: visible; }

/* ─── Оформление карты ───────────────────────────────────────────── */
/* Всё через CSS: смена темы — это смена значений переменных, ни одного
   касания к тысяче узлов из скрипта. */
/* Все обводки — non-scaling-stroke: их толщина считается в экранных
   пикселях и не зависит от масштаба. Иначе при увеличении в десять раз
   граница субъекта превращалась бы в жирную полосу шириной с область,
   а на общем виде истончалась до невидимости. Заодно это избавляет от
   пересчёта толщин в JavaScript на каждом кадре зума. */
.stage path, .stage circle { vector-effect: non-scaling-stroke; }

.stage .neigh   { fill: var(--m-land); stroke: var(--m-coast); stroke-width: 0.7; }
.stage .ru-land { fill: var(--m-land-ru); stroke: none; }
.stage .grat    { fill: none; stroke: var(--m-grat); stroke-width: 1; }
.stage .coast   { fill: none; stroke: var(--m-coast); stroke-width: 1.4; }

/* Штриховка спорных территорий. Цвет задаём правилом, а не атрибутом:
   он должен меняться вместе с темой. */
.stage #hatch line { stroke: var(--m-halo); stroke-width: 2.4; opacity: 0.5; }

.stage .reg {
  stroke: var(--bg-deep);
  stroke-width: 1;
  stroke-linejoin: round;
  cursor: pointer;
  transition: fill-opacity 0.16s var(--ease);
  fill-opacity: 0.92;
}
.stage .reg:hover { fill-opacity: 1; }
/* Подсветка активного субъекта: обводка поверх заливки, чтобы не
   зависеть от порядка узлов. */
.stage .reg.on {
  stroke: var(--m-label);
  stroke-width: 2.6;
  fill-opacity: 1;
}
.stage .fd1 { fill: var(--fd-1); }
.stage .fd2 { fill: var(--fd-2); }
.stage .fd3 { fill: var(--fd-3); }
.stage .fd4 { fill: var(--fd-4); }
.stage .fd5 { fill: var(--fd-5); }
.stage .fd6 { fill: var(--fd-6); }
.stage .fd7 { fill: var(--fd-7); }
.stage .fd8 { fill: var(--fd-8); }

/* Обводку гасим явно: Raphael вешает на каждый путь stroke="#000"
   атрибутом, и без этой строки вокруг спорных территорий появлялся
   жирный чёрный контур, который в тёмной теме просто исчезал. */
.stage .disp { fill: url(#hatch); stroke: none; pointer-events: none; }

/* Точки столиц. Это не круги, а путь нулевой длины с круглым концом
   штриха: при vector-effect:non-scaling-stroke толщина штриха считается
   в экранных пикселях, поэтому точка остаётся одного размера на любом
   масштабе. У круга так не выйдет — радиус пришлось бы пересчитывать
   скриптом для всех 89 столиц на каждом кадре зума. */
.stage .cap-ring, .stage .cap-core {
  fill: none;
  stroke-linecap: round;
  pointer-events: none;
}
.stage .cap-ring { stroke: var(--m-label); stroke-width: 6.5; }
.stage .cap-core { stroke: var(--m-halo); stroke-width: 3.4; }
.stage .cap-ring.big { stroke: var(--m-halo); stroke-width: 8.5; }
.stage .cap-core.big { stroke: var(--warn); stroke-width: 6; }

.stage .riv   { fill: none; stroke: var(--h-river-2); stroke-width: 1.1;
                stroke-linecap: round; stroke-linejoin: round; }
.stage .riv.a { stroke: var(--h-river); stroke-width: 2.1; }
.stage .lake  { fill: var(--h-lake); stroke: var(--h-river); stroke-width: 0.6; }
.stage .lake.res { fill: var(--h-res); }

.stage .oro { stroke: color-mix(in srgb, var(--m-halo) 55%, transparent);
              stroke-width: 0.9; fill-opacity: 0.82; cursor: pointer;
              transition: fill-opacity 0.16s var(--ease); }
.stage .oro:hover { fill-opacity: 1; }
.stage .t-range   { fill: var(--o-range); }
.stage .t-plateau { fill: var(--o-plateau); }
.stage .t-upland  { fill: var(--o-upland); }
.stage .t-plain   { fill: var(--o-plain); }
.stage .t-lowland { fill: var(--o-lowland); }
.stage .t-pen     { fill: var(--o-pen); }

/* Подписи. Размер шрифта живёт на группе — скрипт делит его на текущий
   масштаб, и текст остаётся одного размера на экране при любом зуме.
   Это одна запись в DOM на кадр вместо сотен. */
.stage .lbl {
  fill: var(--m-label);
  font-family: var(--face);
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: middle;
  /* Гало вокруг текста: обводка фоном под самой буквой. Без него
     подписи тонут в пёстрой заливке регионов и рельефа. */
  paint-order: stroke fill;
  stroke: var(--m-halo);
  stroke-width: 3;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
  user-select: none;
}
/* Кегль наследуется от группы-яруса, поэтому размеры задаём в em:
   скрипту достаточно поменять font-size у четырёх групп. */
.stage .lbl.dim   { fill: var(--m-label-2); font-size: 0.95em; }
.stage .lbl.water { fill: var(--h-river); font-style: italic; font-size: 0.85em; }
.stage .lbl.sea   { fill: var(--m-label-2); letter-spacing: 0.08em;
                    text-transform: uppercase; font-weight: 450;
                    font-size: 0.95em; }
.stage .lbl.ocean { letter-spacing: 0.24em; font-size: 1.25em; }
.stage .lbl.cap   { fill: var(--m-label); font-weight: 450; font-size: 0.78em; }
/* Ставится прореживанием, когда подпись налезает на более важную. */
.stage .lbl.hide  { display: none; }

/* ─── Плавающие панели ───────────────────────────────────────────── */
.panel {
  position: absolute;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  z-index: 10;
}

/* Легенда */
.legend {
  left: var(--sp-4);
  bottom: var(--sp-4);
  width: 228px;
  max-height: calc(100% - var(--sp-6));
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.legend > header {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 9px var(--sp-3) 9px var(--sp-4);
  border-bottom: 1px solid var(--line);
  font: 600 11.5px/1 var(--face);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.legend > header button {
  margin-left: auto; width: 26px; height: 26px;
  display: grid; place-items: center;
  border: 0; background: none; border-radius: 6px;
  color: var(--text-mute); cursor: pointer;
}
.legend > header button:hover { background: var(--line); color: var(--text); }
.legend > header svg { width: 14px; height: 14px; transition: transform 0.3s var(--ease); }
.legend .body {
  padding: 10px var(--sp-4) var(--sp-3);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.legend.folded .body { display: none; }
.legend.folded > header svg { transform: rotate(180deg); }

.key { display: flex; align-items: center; gap: 9px; padding: 2.5px 0;
       font-size: 12.5px; line-height: 1.35; }
.key i {
  flex: none; width: 15px; height: 11px; border-radius: 3px;
  border: 1px solid color-mix(in srgb, var(--m-halo) 40%, transparent);
}
.key i.ln { height: 0; border: 0; border-top-width: 3px; border-top-style: solid;
            border-radius: 0; }
.key i.dot { width: 10px; height: 10px; border-radius: 50%; }
.key span { color: var(--text-dim); }
.key b { color: var(--text); font-weight: 500; }

.legend h4 {
  margin: 10px 0 3px;
  font: 600 10.5px/1.4 var(--face);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-mute);
}
.legend h4:first-child { margin-top: 0; }
.legend .note {
  margin: 10px 0 0;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  line-height: 1.4;
  color: var(--text-mute);
}

/* Карточка субъекта */
.card {
  right: var(--sp-4);
  top: var(--sp-4);
  width: 290px;
  padding: var(--sp-4) var(--sp-5) var(--sp-5);
  opacity: 0;
  transform: translateY(-8px) scale(0.98);
  pointer-events: none;
  transition: opacity 0.26s var(--ease), transform 0.26s var(--ease);
}
.card.on { opacity: 1; transform: none; pointer-events: auto; }
.card .kind {
  font: 600 11px/1 var(--face);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
}
.card h2 {
  margin: 10px 0 var(--sp-3);
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -0.015em;
  font-weight: 600;
}
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px var(--sp-3); }
.card dt { color: var(--text-mute); font-size: 13px; }
.card dd { margin: 0; font-size: 13.5px; text-align: right; }
.card .close {
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 0; background: none; border-radius: 8px;
  color: var(--text-mute); cursor: pointer;
}
.card .close:hover { background: var(--line); color: var(--text); }
.card .flag {
  margin-top: var(--sp-4);
  padding: 9px 11px;
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--warn) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent);
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.45;
  display: none;
}
.card.disputed .flag { display: block; }

/* Управление масштабом */
.zoom {
  right: var(--sp-4);
  bottom: var(--sp-4);
  display: flex;
  flex-direction: column;
  padding: 4px;
  gap: 2px;
}
.zoom button {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 0; background: none;
  border-radius: 10px;
  color: var(--text-dim);
  cursor: pointer;
  transition: background 0.18s var(--ease), color 0.18s var(--ease);
}
.zoom button:hover { background: var(--line); color: var(--text); }
.zoom button svg { width: 16px; height: 16px; }
.zoom hr { margin: 2px 4px; border: 0; border-top: 1px solid var(--line); }
.zoom .lvl {
  font: 500 10px/1 var(--mono);
  color: var(--text-mute);
  text-align: center;
  padding: 5px 0 3px;
  letter-spacing: 0.02em;
}

/* Подсказка при наведении */
.tip {
  position: absolute;
  z-index: 20;
  padding: 6px 10px;
  background: var(--glass-2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow);
  font-size: 13px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%) translateY(-10px);
  transition: opacity 0.14s var(--ease);
}
.tip.on { opacity: 1; }
.tip i { display: block; font-style: normal; color: var(--text-mute); font-size: 11.5px; }

/* Экран загрузки */
.boot {
  position: absolute; inset: 0;
  display: grid; place-content: center; justify-items: center;
  gap: var(--sp-4);
  background: var(--bg-deep);
  z-index: 40;
  transition: opacity 0.4s var(--ease);
}
.boot.off { opacity: 0; pointer-events: none; }
.boot p { margin: 0; color: var(--text-mute); font-size: 13px; }
.boot .sp {
  width: 26px; height: 26px;
  border: 2px solid var(--line-2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.boot .fail { color: var(--warn); max-width: 42ch; text-align: center; line-height: 1.5; }

/* ─── Адаптив ────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .brand span { display: none; }
  .find { width: 100%; order: 5; }
  .bar { padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); }
  .legend { width: 210px; left: var(--sp-2); bottom: var(--sp-2); }
  .card { width: min(290px, calc(100% - var(--sp-4)));
          right: var(--sp-2); top: var(--sp-2); }
  .zoom { right: var(--sp-2); bottom: var(--sp-2); }
}

@media (max-width: 620px) {
  /* Шапка на телефоне складывается в три ряда, поэтому ужимаем всё,
     что можно: каждый лишний пиксель здесь отнимается у карты. */
  .brand b { display: none; }
  .bar { gap: 6px; padding: 6px var(--sp-2); min-height: 0; }
  .seg button { padding: 7px 10px; font-size: 13.5px; min-height: 34px; }
  .seg.sub button { padding: 6px 9px; font-size: 13px; }
  .find input { height: 36px; }
  .ico { width: 36px; height: 36px; }
  .legend { width: calc(100% - var(--sp-4)); max-height: 52%; }
  .card { width: calc(100% - var(--sp-4)); }
  /* Легенда занимает низ во всю ширину, поэтому кнопки масштаба
     переезжают над ней и ложатся в строку. */
  .zoom { flex-direction: row; align-items: center; bottom: 58px; }
  .zoom hr { width: 1px; height: 22px; border-top: 0; border-left: 1px solid var(--line);
             margin: 0 2px; }
  .zoom .lvl { padding: 0 4px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <!-- ─── Панель управления ─────────────────────────────────────── -->
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 15 L7 10 L11 12.5 L16 7 L22 9.5" stroke="var(--accent)"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="7" r="2.6" fill="var(--warn)"/>
      </svg>
      <b>Атлас России</b>
      <span>89 субъектов</span>
    </div>

    <nav class="seg" id="tabs" role="tablist" aria-label="Тип карты">
      <button role="tab" id="tab-phys" aria-selected="false"
              aria-controls="stage" data-tab="phys">Физическая</button>
      <button role="tab" id="tab-pol" aria-selected="true"
              aria-controls="stage" data-tab="pol">Политическая</button>
    </nav>

    <div class="subwrap" id="subwrap">
      <div>
        <nav class="seg sub" id="subtabs" role="tablist"
             aria-label="Раздел физической карты">
          <button role="tab" aria-selected="true" data-sub="hydro">Гидрография</button>
          <button role="tab" aria-selected="false" data-sub="oro">Орография</button>
        </nav>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="find" id="find">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Поиск по карте…" aria-label="Поиск объекта на карте"
             role="combobox" aria-expanded="false" aria-controls="hits"
             aria-autocomplete="list">
      <button class="clear" id="qclear" type="button" aria-label="Очистить поиск">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </button>
      <ul class="hits" id="hits" role="listbox" aria-label="Результаты поиска"></ul>
    </div>

    <button class="ico" id="theme" type="button" aria-label="Переключить тему">
      <svg class="moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- ─── Карта ─────────────────────────────────────────────────── -->
  <main class="stage-wrap" id="wrap">
    <div class="stage" id="stage"></div>

    <div class="tip" id="tip" role="status" aria-live="polite"></div>

    <aside class="panel legend" id="legend" aria-label="Легенда карты">
      <header>
        <span id="legend-title">Легенда</span>
        <button type="button" id="legend-fold" aria-expanded="true"
                aria-controls="legend-body" aria-label="Свернуть легенду">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>
      <div class="body" id="legend-body"></div>
    </aside>

    <aside class="panel card" id="card" aria-live="polite">
      <button class="close" type="button" id="card-close" aria-label="Закрыть карточку">
        <svg viewBox="0 0 24 24" fill="none" width="15" height="15" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </button>
      <div class="kind" id="card-kind"></div>
      <h2 id="card-name"></h2>
      <dl id="card-rows"></dl>
      <p class="flag" id="card-flag"></p>
    </aside>

    <div class="panel zoom" role="group" aria-label="Масштаб карты">
      <button type="button" id="zin" aria-label="Приблизить">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round"/>
        </svg>
      </button>
      <div class="lvl" id="lvl" aria-hidden="true">1.0×</div>
      <button type="button" id="zout" aria-label="Отдалить">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round"/>
        </svg>
      </button>
      <hr>
      <button type="button" id="zreset" aria-label="Показать карту целиком">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="boot" id="boot">
      <div class="sp" id="boot-sp"></div>
      <p id="boot-msg">Загрузка данных карты…</p>
    </div>
  </main>
</div>

<!-- Библиотеки. Raphael рисует SVG-пути карт, Panzoom двигает и
     масштабирует холст. Версии закреплены, а хеши integrity гарантируют,
     что с CDN приедет именно тот файл: подменённый скрипт браузер
     просто не выполнит. Если файл не доедет вовсе, страница скажет об
     этом прямо, а не покажет пустой экран. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"
        integrity="sha384-5fwEhxN8gjmQlK6ngccfyi8BVu5leqLqTqliCXNoLVGCjpGfzJwJ2pS8BLDIxWSt"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"
        integrity="sha384-ZOYffjPUyf23W5DufkQVkrN7uZvIMRRCPo64S2N2S0mFM9+bFZpn2/MQTy2O35gF"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="data/base.js"></script>
<script src="data/regions.js"></script>
<script src="data/hydro.js"></script>
<script src="data/oro.js"></script>
<script src="app.js"></script>
</body>
</html>
